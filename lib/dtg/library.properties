name=DTG_IoT
version=1.2.0
author=DTG Corp
maintainer=DTG Corp <iot@dtgsoft.vn>
sentence=Official ESP32/ESP8266 client for DTG IoT Hub (MQTT, Modbus RTU on ESP32, no-code I/O, FOTA).
paragraph=Wi-Fi and cellular MQTT client with a Let's Encrypt trust store (ISRG Root X1/X2, Root YR/YE), Hub downlink periodUplink, no-code GPIO, built-in Modbus RTU (ESP32, vendored eModbus, MIT), and Baseline FOTA (HTTPS+SHA-256, Range resume; ESP32 confirm/rollback). ESP8266: Wi-Fi MQTT TLS (BearSSL), SoftAP provision, Hub cmd, no-code GPIO, OTA without A/B rollback. Install PubSubClient, ArduinoJson, and TinyGPSPlus from Library Manager.
category=Communication
url=https://github.com/DTG-Corp/dtg-arduino
architectures=esp32,esp8266
includes=DTG_IoT.h
depends=PubSubClient,TinyGPSPlus,ArduinoJson
